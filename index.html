<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصحف الروايات">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
[hidden]{display:none!important}</style>
<script>window.MUSHAF_STANDALONE=true;window.MUSHAF_SW=true;</script>
</head>
<body>
<title>مصحف الروايات</title>
<style>
/* Full-screen mushaf: the page fills the screen; a tap shows a top bar (riwayah, differences,
   index) and a bottom bar (page, slider).  Pages are drawn on canvas from the KFGQPC glyphs;
   a transparent text layer over them makes the text selectable and copyable. */
/* High contrast, as in the Tarteel app: black on white, white on black. */
:root{
  --paper:#ffffff; --ground:#eef0ec; --ink:#000000; --diff:#d4101c; --accent:#1e5a4b; --accent-ink:#f6f2e6;
  --frame:#1d2a26; --sura:#000000; --muted:#5d5f59; --hl:rgba(30,90,75,.12); --sel:rgba(30,90,75,.30); --found:rgba(216,150,20,.38);
  --bar:rgba(255,255,255,.95); --line:rgba(0,0,0,.12); --card:#ffffff; --shadow:0 10px 30px rgba(20,24,20,.18);
  --ui:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#000000; --ground:#1b1c1a; --ink:#ffffff; --diff:#ff5a4f; --accent:#86c9b3; --accent-ink:#0f110e;
  --frame:#e9ece7; --sura:#ffffff; --muted:#a2a49e; --hl:rgba(134,201,179,.20); --sel:rgba(134,201,179,.38); --found:rgba(240,180,60,.42);
  --bar:rgba(16,17,16,.95); --line:rgba(255,255,255,.14); --card:#151614; --shadow:0 10px 30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#000000; --ground:#1b1c1a; --ink:#ffffff; --diff:#ff5a4f; --accent:#86c9b3; --accent-ink:#0f110e;
  --frame:#e9ece7; --sura:#ffffff; --muted:#a2a49e; --hl:rgba(134,201,179,.20); --sel:rgba(134,201,179,.38); --found:rgba(240,180,60,.42);
  --bar:rgba(16,17,16,.95); --line:rgba(255,255,255,.14); --card:#151614; --shadow:0 10px 30px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---- pages ---- */
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:pan-y pinch-zoom;background:var(--paper)}
.slot{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);will-change:transform;
  padding:max(0px,calc(var(--inset-top,0px) - env(safe-area-inset-top,0px))) 0 0}
.phead,.pfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;
  font-size:13px;color:var(--muted);height:26px;white-space:nowrap;overflow:hidden}
.phead .pj{font-variant-numeric:tabular-nums;color:var(--ink);opacity:.8;display:flex;align-items:center}
.phead .pie{width:13px;height:13px;margin:0 7px;flex:none}
.phead .pr{color:var(--accent);font-weight:700;font-size:12.5px}
.phead .ps{color:var(--ink);opacity:.8}
.pfoot{justify-content:center;height:22px;font-size:13.5px;font-variant-numeric:tabular-nums}
.pbox{flex:1;min-height:0;position:relative}
.pbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tl{position:absolute;inset:0;overflow:hidden;direction:rtl;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
  font-family:var(--ui)}
.tl span{position:absolute;top:0;white-space:pre;color:transparent;transform-origin:0 0;cursor:text}
.tl span::selection{background:transparent;color:transparent}
.tl span::-moz-selection{background:transparent;color:transparent}

/* ---- bars ---- */
.bar{position:fixed;left:0;right:0;z-index:10;background:var(--bar);
  -webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px);
  visibility:hidden;transition:transform .22s cubic-bezier(.2,.7,.2,1),visibility 0s linear .22s}
.bar.top{top:0;transform:translateY(-104%);display:flex;align-items:center;gap:8px;
  padding:max(env(safe-area-inset-top,0px),var(--inset-top,0px)) 10px 8px;padding-top:calc(max(env(safe-area-inset-top,0px),var(--inset-top,0px)) + 8px);
  border-bottom:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.bar.bottom{bottom:0;transform:translateY(104%);padding:8px 12px calc(max(env(safe-area-inset-bottom,0px),var(--inset-bottom,0px)) + 8px);
  border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:6px}
body.bars .bar{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,.7,.2,1),visibility 0s}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
.iconbtn:active{background:var(--hl)}
.iconbtn svg{width:22px;height:22px}
.riwbtn{flex:1;min-width:0;max-width:300px;margin:0 auto;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:14px;background:var(--ground);padding:0 14px}
.riwbtn .rn{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riwbtn .rr{font-size:12.5px;color:var(--muted);white-space:nowrap}
.riwbtn svg{width:16px;height:16px;flex:none;color:var(--muted)}
.riwbtn:active{background:var(--hl)}
.rlist{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 10px 12px;min-height:0}
.rgroup{font-size:12.5px;color:var(--muted);padding:12px 8px 4px;font-weight:600;letter-spacing:.02em}
.rrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;width:100%;text-align:right;padding:10px 12px;border-radius:12px}
.rrow:active,.rrow[aria-checked="true"]{background:var(--hl)}
.rrow .t{font-size:17px;font-weight:700}
.rrow .d{grid-column:1;font-size:12.5px;color:var(--muted);line-height:1.5}
.rrow .ck{grid-row:span 2;grid-column:2;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.rrow[aria-checked="true"] .ck{border:6px solid var(--accent)}
.diffbtn{flex:none;height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:12px;
  border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.diffbtn .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--diff);box-sizing:border-box}
.diffbtn[aria-pressed="true"]{color:var(--diff);border-color:var(--diff);border-color:color-mix(in srgb,var(--diff) 45%,transparent)}
.diffbtn[aria-pressed="true"] .dot{background:var(--diff)}
.where{display:flex;justify-content:center;align-items:baseline;gap:10px;min-height:28px;border-radius:10px;
  font-size:14px;color:var(--ink);padding:2px 8px}
.where .wp{color:var(--muted);font-variant-numeric:tabular-nums}
.where:active{background:var(--hl)}
.nav{display:flex;align-items:center;gap:6px}
.nav input{flex:1;min-width:0;accent-color:var(--accent);height:28px;direction:rtl}

/* ---- selection actions, toast, loading ---- */
.selbar{position:fixed;z-index:12;left:0;right:0;margin:0 auto;width:max-content;
  bottom:calc(max(env(safe-area-inset-bottom,0px),var(--inset-bottom,0px)) + 18px);
  display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);
  max-width:calc(100% - 32px)}
body.bars .selbar{bottom:calc(var(--bbh,110px) + 10px)}
.selbar button{height:38px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.selbar button:active{background:var(--hl)}
.selbar [data-act="info"]{color:var(--diff)}
.selbar[hidden],.toast[hidden]{display:none!important}
.toast{position:fixed;z-index:30;left:0;right:0;margin:0 auto;width:max-content;top:calc(max(env(safe-area-inset-top,0px),var(--inset-top,0px)) + 64px);
  max-width:min(calc(100% - 40px),440px);box-sizing:border-box;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.6;
  box-shadow:var(--shadow);text-align:center;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;pointer-events:none;z-index:2}
#loading[hidden]{display:none!important}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);
  animation:spin 0.9s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.slot,.bar{transition:none!important}}

/* ---- sheets ---- */
.scrim{position:fixed;inset:0;background:rgba(10,10,8,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none!important}
.sheet{width:100%;max-width:560px;max-height:86%;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-bottom:max(env(safe-area-inset-bottom,0px),var(--inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.sheet-h h2{font-size:17px;margin:0;flex:1;text-wrap:balance}
.tabs{display:flex;gap:6px;padding:0 14px 8px}
.tabs button{height:34px;padding:0 14px;border-radius:10px;font-size:15px;color:var(--muted);background:var(--ground)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.goto{display:flex;gap:8px;padding:0 14px 10px}
.goto input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);font:inherit;font-size:16px;padding:0 12px;text-align:center}
.goto button{height:40px;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.list{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 6px 10px;min-height:0}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;width:100%;text-align:right;
  padding:10px 10px;border-radius:10px;font-size:16px}
.row:active,.row.cur{background:var(--hl)}
.row .n{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold);
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .meta{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.row .pg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.settings{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.settings label{display:flex;align-items:center;gap:8px}
.settings .opt{display:flex;gap:4px;background:var(--ground);border-radius:10px;padding:3px}
.settings .opt button{height:30px;padding:0 10px;border-radius:8px;font-size:13px}
.settings .opt button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.about{padding:0 14px 14px;font-size:12px;line-height:1.7;color:var(--muted)}
.info{padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px}
.info .ref{font-size:15px;font-weight:600;padding-top:8px}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;background:var(--paper);border-radius:12px;padding:10px 12px}
.cmp .lbl{font-size:13px;color:var(--muted)}
.cmp canvas{height:56px;justify-self:start}
.cmp .lbl{white-space:nowrap}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:40px;padding:0 18px;border-radius:12px;background:var(--ground);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.notes{display:flex;flex-direction:column;gap:6px}
.notes p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink)}
.notes b{color:var(--diff);font-weight:700}
.info{overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 -4px}
.kinds{display:flex;flex-direction:column;gap:8px}
.kind{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline}
.kind b{grid-row:span 2;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--diff);border-radius:7px;padding:2px 8px;white-space:nowrap}
.kind span{font-size:13.5px;line-height:1.7}
.reads{display:flex;flex-direction:column;gap:2px;background:var(--paper);border-radius:12px;padding:6px}
.rd{display:grid;grid-template-columns:22px auto 1fr;align-items:center;gap:4px 10px;padding:6px 8px;border-radius:10px}
.rd.mine{background:var(--hl)}
.rd .i{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rd canvas{height:46px;justify-self:start}
.rd .who{font-size:13.5px;line-height:1.6}
.rd .who em{font-style:normal;color:var(--accent);font-weight:700}
.rd .none{font-size:14px;color:var(--muted)}

/* ---- search ---- */
.sheet.tall{height:86%}
.sbox{display:flex;gap:8px;align-items:center;padding:12px 14px 8px}
.sbox input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font:inherit;font-size:17px;padding:0 14px;direction:rtl;-webkit-appearance:none;appearance:none}
.sbox input::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:6px;padding:0 14px 8px;flex-wrap:wrap}
.chips button{height:34px;padding:0 13px;border-radius:17px;font-size:14px;color:var(--muted);background:var(--ground)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sstat{padding:0 16px 6px;font-size:13px;color:var(--muted);min-height:18px}
.results{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 8px 12px;min-height:0;flex:1}
.res{display:block;width:100%;text-align:right;padding:10px 10px 12px;border-radius:12px;border-bottom:1px solid var(--line)}
.res:active{background:var(--hl)}
.res .rh{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:2px}
.res .rh b{color:var(--ink);font-weight:600}
.res .rt{font-family:"KFGQPC Uthmanic",serif;font-size:22px;line-height:2.05;color:var(--ink);direction:rtl;word-spacing:2px}
.res mark{background:var(--found);color:inherit;border-radius:5px;padding:0 1px}
.more{display:block;margin:10px auto 4px;height:40px;padding:0 20px;border-radius:12px;background:var(--ground);font-weight:600}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.findbar{position:fixed;z-index:11;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 24px);
  bottom:calc(max(env(safe-area-inset-bottom,0px),var(--inset-bottom,0px)) + 16px);
  display:flex;align-items:center;gap:2px;padding:4px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
body.bars .findbar{bottom:calc(var(--bbh,110px) + 10px)}
.findbar.top{bottom:auto;top:calc(max(env(safe-area-inset-top,0px),var(--inset-top,0px)) + 8px)}
body.bars .findbar.top{top:auto;bottom:calc(var(--bbh,110px) + 10px)}
.findbar[hidden]{display:none!important}
.findbar .fq{font-size:14px;padding:0 8px;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.findbar .fn{font-size:14px;font-weight:600;padding:0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.findbar .iconbtn{width:38px;height:38px}

/* ---- dabt legend ---- */
.legend{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px 14px;min-height:0}
.lg{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);width:100%;text-align:right}
.lg canvas{grid-row:span 2;justify-self:center;background:var(--paper);border-radius:10px}
.lg .lt{font-size:15px;font-weight:700}
.lg .ld{font-size:13px;line-height:1.7;color:var(--muted)}
.lg .lr{font-size:12px;color:var(--accent)}
.linkbtn{height:36px;padding:0 12px;border-radius:10px;background:var(--ground);font-size:14px;font-weight:600;color:var(--ink)}
</style>

<div id="app" dir="rtl" lang="ar">
  <main id="viewport" aria-label="صفحات المصحف"></main>
  <header class="bar top" id="topBar">
    <button class="iconbtn" id="menuBtn" aria-label="الفهرس والإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="iconbtn" id="searchBtn" aria-label="البحث في القرآن">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/></svg>
    </button>
    <button class="riwbtn" id="riwBtn" aria-haspopup="dialog" aria-label="الرواية: ورش. اختيار الرواية">
      <span class="rn" id="riwName">ورش</span><span class="rr" id="riwReader">عن نافع</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="diffbtn" id="diffBtn" aria-pressed="true" title="إظهار الفرق عن رواية حفص بالأحمر"><span class="dot"></span>الفروق</button>
    <button class="iconbtn" id="fsBtn" aria-label="ملء الشاشة" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>
  <footer class="bar bottom" id="bottomBar">
    <button class="where" id="whereBtn" aria-label="الفهرس والانتقال إلى صفحة"><span id="whereText"></span><span class="wp" id="wherePage"></span></button>
    <div class="nav">
      <button class="iconbtn" id="prevBtn" aria-label="الصفحة السابقة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <input type="range" id="slider" min="1" max="604" step="1" value="1" dir="rtl" aria-label="الصفحة">
      <button class="iconbtn" id="nextBtn" aria-label="الصفحة التالية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
  </footer>
  <div class="findbar" id="findBar" role="toolbar" aria-label="نتائج البحث" hidden>
    <button class="iconbtn" id="findPrev" aria-label="النتيجة السابقة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <span class="fn" id="findN"></span>
    <button class="iconbtn" id="findNext" aria-label="النتيجة التالية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="fq" id="findQ" aria-label="العودة إلى نتائج البحث"></button>
    <button class="iconbtn" id="findClose" aria-label="إغلاق البحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="selbar" id="selBar" hidden>
    <button data-act="copy">نسخ</button>
    <button data-act="copyAya">نسخ الآية</button>

<script>

  warsh: {short: "ورش", long: "رواية ورش عن نافع من طريق الأزرق", of: "عن نافع", reader: "nafi"},
  bazzi: {short: "البزي", long: "رواية البزي عن ابن كثير", of: "عن ابن كثير", reader: "ibnkathir"},
  duri: {short: "الدوري", long: "رواية الدوري عن أبي عمرو", of: "عن أبي عمرو", reader: "abuamr"},
  susi: {short: "السوسي", long: "رواية السوسي عن أبي عمرو", of: "عن أبي عمرو", reader: "abuamr"},
  shubah: {short: "شعبة", long: "رواية شعبة عن عاصم", of: "عن عاصم", reader: "asim"},
  hafs: {short: "حفص", long: "رواية حفص عن عاصم", of: "عن عاصم", reader: "asim"}
};
const READERS = [
  {id: "nafi", name: "نافع المدني", short: "نافع", keys: ["qalun", "warsh"]},
  {id: "ibnkathir", name: "ابن كثير المكي", short: "ابن كثير", keys: ["bazzi"]},
  {id: "abuamr", name: "أبو عمرو البصري", short: "أبو عمرو", keys: ["duri", "susi"]},
  {id: "asim", name: "عاصم الكوفي", short: "عاصم", keys: ["shubah", "hafs"]}
];
const RIW_NOTE = {
  qalun: "القصر في المنفصل، والتسهيل والإدخال، وإسكان «هو» و«هي»", warsh: "النقل والإبدال والتقليل وصلة الميم قبل الهمز وتغليظ اللام",
  bazzi: "صلة ميم الجمع وهاء الكناية، والقصر في المنفصل، والتسهيل", duri: "الإمالة والتقليل، والتسهيل والإدخال، والإدغام الصغير",
  susi: "الإدغام الكبير، وإبدال الهمز الساكن، والإمالة والتقليل", shubah: "الإمالة في كلمات، وفرش الحروف",
  hafs: "الأصل الذي تُقارن به الروايات؛ يُلوَّن فيه ما اختلفت فيه الروايات فرشاً"
};
const LAST_PAGE = 604;
// extra stroke round each glyph, font units (2048 per em): thin, medium, bold (the default:
// the weight of the printed Madinah mushaf and of the Tarteel app's pages)
const WEIGHTS = [0, 56, 112];
const TAP_WAIT = 260;       // ms to wait for a second tap before a single tap counts

/* ---------- storage (optional) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("mushaf." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mushaf." + k, JSON.stringify(v)); } catch (e) {} }
};
const state = {
  riwaya: RIW[store.get("riwaya", "warsh")] ? store.get("riwaya", "warsh") : "warsh",
  page: Math.min(LAST_PAGE, Math.max(1, store.get("page", 1) | 0)),
  diff: store.get("diff", true) !== false,
  theme: store.get("theme", "auto"),
  weight: [0, 1, 2].includes(store.get("weight", 2)) ? store.get("weight", 2) : 2,
  taqlil: store.get("taqlil", "filled") === "hollow" ? "hollow" : "filled",   // the Kuwait mushaf: one filled dot
  bars: false
};
const lineW = () => WEIGHTS[state.weight] || 0;

/* ---------- Android app (when present) ---------- */
const root = document.documentElement;
root.setAttribute("dir", "rtl"); root.setAttribute("lang", "ar");     // the sheets too, wherever the page is hosted
const bridge = window.AndroidBridge || null;
function call(name, ...args) {
  try { return bridge && typeof bridge[name] === "function" ? bridge[name](...args) : undefined; } catch (_) { return undefined; }
}
function setInsets(top, bottom) {
  root.style.setProperty("--inset-top", Math.max(0, +top || 0) + "px");
  root.style.setProperty("--inset-bottom", Math.max(0, +bottom || 0) + "px");
  if (pager && pager.D) relayout();
}
window.__mushafInsets = setInsets;

/* ---------- theme ---------- */
let themeByApp = false;
function applyTheme() {
  let dark;
  if (state.theme === "light" || state.theme === "dark") {
    root.setAttribute("data-theme", state.theme);
    dark = state.theme === "dark";
  } else if (bridge) {
    dark = !!call("isNight");
    root.setAttribute("data-theme", dark ? "dark" : "light");
  } else {
    if (themeByApp) root.removeAttribute("data-theme");
    const host = root.getAttribute("data-theme");
    dark = host ? host === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  }
  themeByApp = state.theme !== "auto" || !!bridge;
  call("setDark", dark);
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === state.theme)));
  colours = null;
  pager && pager.redrawAll();
}
let colours = null;
function col() {
  if (!colours) {
    const cs = getComputedStyle(root);
    const g = n => cs.getPropertyValue(n).trim();
    colours = {paper: g("--paper"), ink: g("--ink"), diff: g("--diff"), accent: g("--accent"), frame: g("--frame"),
      sura: g("--sura"), hl: g("--hl"), sel: g("--sel"), found: g("--found"), muted: g("--muted")};
  }

}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.theme === "auto") applyTheme(); });
window.__mushafSystemTheme = () => { if (state.theme === "auto") applyTheme(); };

/* ---------- data ----------
   Every data file is fetched with a relative path, from ./data/ (the builds as made) or
   from the page's own folder (./, a flat upload such as a GitHub Pages repository filled
   from a phone).  Each file may also be a .txt file: the JSON as it is, the binary files
   (glyph runs, the Hafs font) as base64 text, for hosts and uploaders that take text only.
   Once a file is found, its folder is tried first for the rest. */
let dataDir = null;
function fetchFirst(cands) {
  let i = 0;
  const next = () => {
    if (i >= cands.length) {
      const e = new Error("not found: " + cands.map(c => c.url).join(", "));
      e.missing = cands[0].url.split("/").pop();
      return Promise.reject(e);
    }
    const c = cands[i++];
    return fetch(c.url).then(r => {
      if (!r.ok || /text\/html/i.test(r.headers.get("content-type") || "")) return next();   // missing (or a host's HTML fallback page)
      dataDir = c.dir;
      return {r, c};
    }, next);
  };
  return next();
}
function candidates(names) {           // names: [[file name, form], ...] in order of preference
  const flat = !!window.MUSHAF_FLAT;    // the flat text-only build: beside the page, .txt first
  const dirs = dataDir ? [dataDir, dataDir === "./data/" ? "./" : "./data/"] : flat ? ["./", "./data/"] : ["./data/", "./"];
  if (flat) names = names.slice().sort((a, b) => (b[0].endsWith(".txt") ? 1 : 0) - (a[0].endsWith(".txt") ? 1 : 0));
  const out = [];
  for (const dir of dirs) for (const [name, form] of names) out.push({url: dir + name, dir, form});
  return out;
}
function fromBase64(t) {
  const b = atob(t.replace(/\s+/g, "")), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u.buffer;
}
function getText(name) {
  return fetchFirst(candidates([[name, "text"]])).then(({r}) => r.text());
}
function getJSON(name) {
  return fetchFirst(candidates([[name, "json"], [name + ".txt", "json"]])).then(({r}) => r.text()).then(t => JSON.parse(t));
}
function getBinary(name, b64name) {     // the file itself, or its bytes as base64 text
  const names = window.MUSHAF_B64 ? [[b64name, "b64"], [name, "bin"]] : [[name, "bin"], [b64name, "b64"]];
  return fetchFirst(candidates(names)).then(({r, c}) => c.form === "bin" ? r.arrayBuffer() : r.text().then(fromBase64));
}
/* the glyph outlines of a font (one store for the riwayat set in it, shared) */
const DISK_GID = 30000, RING_GID = 30001;
const stores = {};
function loadStore(name) {
  if (!stores[name]) {
    stores[name] = getJSON(name + ".paths.json").then(st => {
      const cache = new Map();
      st.get = gid => {
        if (gid === RING_GID && state.taqlil === "filled") gid = DISK_GID;     // the Kuwait mushaf: one filled dot
        let p = cache.get(gid);
        if (p === undefined) { const d = st.paths[gid]; p = d ? new Path2D(d) : null; cache.set(gid, p); }
        return p;
      };
      return st;
    });
    stores[name].catch(() => { delete stores[name]; });
  }
  return stores[name];
}
/* the flat text-only build: everything a riwayah needs in one .txt file */
const packs = {};
function loadPack(name) {
  if (!(name in packs)) {
    packs[name] = window.MUSHAF_FLAT ? getText(name + ".pack.txt").then(t => JSON.parse(t)) : Promise.resolve(null);
    packs[name] = packs[name].catch(e => { if (window.MUSHAF_FLAT) packs[name + ":missing"] = e; return null; });
  }
  return packs[name];
}
function parseRuns(buf) {             // MSHF v1 (tools/build.py write_bin)
  const dv = new DataView(buf);
  const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
  if (magic !== "MSHF") throw new Error("bad data");
  const nt = dv.getUint32(8, true), nw = dv.getUint32(12, true), ng = dv.getUint32(16, true);
  let o = 20;
  const adv = new Int32Array(buf, o, nt); o += 4 * nt;
  const start = new Uint32Array(buf, o, nt + 1); o += 4 * (nt + 1);
  const tokOf = new Uint16Array(buf, o, nw); o += 2 * nw;

  const gl = new Int16Array(buf, o, ng * 3);
  return {adv, start, tokOf, gl, nw};
}
function wordNumbers(meta, nw) {      // the shared word numbering (quran-text): pairs.numbers in tools/
  const nb = meta.numbering || {missing: [], joined: []};
  const missing = new Set(nb.missing), joined = new Map(nb.joined.map(j => [j[0], [j[1], j[2]]]));
  const num = new Int32Array(nw), last = new Int32Array(nw);
  let n = 1;
  for (let p = 0; p < nw; p++) {
    while (missing.has(n)) n++;
    const j = joined.get(p);
    if (j) { num[p] = j[0]; last[p] = j[1]; n = j[1] + 1; } else { num[p] = last[p] = n; n++; }
  }
  return {num, last};
}
const cache = {};
function loadData(key) {
  if (!cache[key]) {
    cache[key] = loadPack(key).then(pk => pk
      ? [pk.json, fromBase64(pk.glyphs), pk]
      : getJSON(key + ".json").then(meta => getBinary(key + ".bin", key + ".glyphs.txt").then(buf => [meta, buf, null])))
    .then(([meta, buf, pk]) => loadStore(meta.store).then(st => [meta, buf, pk, st]))
    .then(([meta, buf, pk, st]) => {
      const R = parseRuns(buf), nw = R.nw;
      const red = new Map();
      for (const k in meta.red) red.set(+k, new Set(meta.red[k]));
      const ends = new Set();
      for (let k = 1; k < meta.ayah_starts.length; k++) ends.add(meta.ayah_starts[k] - 1);
      ends.add(nw - 1);
      return {key, meta, adv: R.adv, start: R.start, tokOf: R.tokOf, gl: R.gl, red, path: st.get, store: st, ends,
        words: pk ? pk.words.split("\n") : null, pack: pk, layouts: new Map(), nums: null,
        nostroke: new Set(meta.nostroke || []), aya: new Set(meta.aya || st.aya || [])};
    });
    cache[key].catch(() => { delete cache[key]; });
  }
  return cache[key];
}
const numOf = (D, p) => { if (!D.nums) D.nums = wordNumbers(D.meta, D.tokOf.length); return [D.nums.num[p], D.nums.last[p]]; };
function loadWords(D) {           // the Unicode text of every printed word form (for selecting and copying)
  if (D.words) return Promise.resolve(D);
  if (!D.wordsP) {
    D.wordsP = getText(D.key + ".words.txt").then(t => { D.words = t.split("\n"); return D; });
    D.wordsP.catch(() => { D.wordsP = null; });
  }
  return D.wordsP;
}
/* the readings of every word where the riwayat differ (tools/readings.py) */
let khilafP = null;
function loadKhilaf() {
  if (!khilafP) {
    khilafP = loadPack("khilaf").then(pk => pk
      ? [pk.json, fromBase64(pk.glyphs)]
      : getJSON("khilaf.json").then(m => getBinary("khilaf.bin", "khilaf.glyphs.txt").then(b => [m, b])))
    .then(([m, buf]) => loadStore(m.store).then(st => {
      const R = parseRuns(buf);
      return {meta: m, adv: R.adv, start: R.start, gl: R.gl, path: st.get, nostroke: new Set(m.nostroke || []), aya: new Set()};
    }));

  }
  return khilafP;
}
const wordText = (D, p) => D.words ? D.words[D.tokOf[p]] : "";

/* ---------- layout ---------- */
function layoutPage(D, pno, W, H) {
  const lwU = lineW();
  const k = pno + ":" + W + "x" + H + ":" + lwU;
  const hit = D.layouts.get(k);
  if (hit) return hit;
  const m = D.meta, upem = m.upem, T = m.target / upem;
  const lines = m.pages[pno - 1].lines;
  const padX = Math.max(8, W * 0.024), padY = Math.max(4, H * 0.008);
  const availW = W - 2 * padX, availH = H - 2 * padY;
  const fs = Math.min(availW / T, availH / (15 * 1.95));
  const s = fs / upem, tw = fs * T;
  const lh = Math.min(availH / 15, fs * 2.75);
  const top = padY + (availH - lh * 15) / 2;
  const left = (W - tw) / 2;
  const sp = m.space * s, ext = lwU * s;     // the stroke widens every word by ext
  const opening = pno <= 2;
  const off = opening ? lh * (15 - lines.length) / 2 : 0;
  const out = [];
  lines.forEach((ln, i) => {
    const base = top + off + lh * i + lh * 0.63;
    const L = {t: ln.t, base, s: ln.s, toks: []};
    if (ln.t === "w" || ln.t === "bw") {
      const n = ln.b - ln.a;
      let nat = 0;
      for (let p = ln.a; p < ln.b; p++) nat += D.adv[D.tokOf[p]] * s;
      let gx = 1, gap = sp;
      const centred = opening || ln.t === "bw" || n === 1;
      if (!centred) {
        const room = tw - sp * (n - 1), minGap = sp * 0.3 + ext;   // words never touch, however bold
        gx = Math.min(n <= 6 ? 1.14 : 1.08, Math.max(0.85, room / nat));
        gap = (tw - nat * gx) / (n - 1);
        if (gap < minGap) { gx = (tw - minGap * (n - 1)) / nat; gap = minGap; }
      }
      const total = nat * gx + gap * (n - 1);
      let xr = centred ? left + (tw + total) / 2 : left + tw;
      for (let p = ln.a; p < ln.b; p++) {
        const tid = D.tokOf[p], w = D.adv[tid] * s * gx;
        L.toks.push({p, tid, x: xr - w, w, gx});
        xr -= w + gap;
      }
    }
    out.push(L);
  });
  const lay = {fs, s, tw, left, top: top + off, lh, n: lines.length, lines: out, W, H, opening};
  D.layouts.set(k, lay);
  return lay;
}

/* ---------- drawing ---------- */
function drawToken(ctx, D, tid, x0, base, s, gx, redSet, c, dpr, bold) {
  const a = D.start[tid], b = D.start[tid + 1], gl = D.gl;
  let fill = null;
  for (let k = a; k < b; k++) {
    const gid = gl[3 * k], p = D.path(gid);
    if (!p) continue;
    const f = redSet && redSet.has(k - a) ? c.diff : c.ink;
    if (f !== fill) { ctx.fillStyle = f; ctx.strokeStyle = f; fill = f; }
    // the round dots of imala and taqlil are drawn without the bold stroke: their size and hole are the sign
    const round = D.nostroke.has(gid);

  topBar.setAttribute("aria-hidden", String(!state.bars));
  bottomBar.setAttribute("aria-hidden", String(!state.bars));
  if (state.bars) {
    updateBars();
    requestAnimationFrame(() => root.style.setProperty("--bbh", bottomBar.offsetHeight + "px"));
  }
  call("setBars", state.bars);

function whereLabel(D, pno) {

}

/* ---------- selection and copying ---------- */
const selBar = document.getElementById("selBar"), toastEl = document.getElementById("toast");
let selWords = null;                          // word positions of the last selection on the page
function hasSelection() {
  const s = window.getSelection && window.getSelection();
  return !!(s && !s.isCollapsed && s.rangeCount);
}
function clearSelection() {
  const s = window.getSelection && window.getSelection();
  if (s && !s.isCollapsed) { try { s.removeAllRanges(); } catch (_) {} }
  selWords = null; selBar.hidden = true;
  showSel(null);
}
function showSel(ws) {                         // draw the selected words on the current page
  if (!pager || !pager.D) return;
  const sl = pager.slots[1], r = ws ? [ws[0], ws[ws.length - 1]] : null;
  const same = (!r && !sl.sel) || (r && sl.sel && r[0] === sl.sel[0] && r[1] === sl.sel[1]);
  if (same) return;
  pager.slots.forEach(o => { if (o !== sl && o.sel) { o.sel = null; pager.render(o, pager.D, o.page, "hl"); } });
  sl.sel = r;
  pager.render(sl, pager.D, sl.page, "hl");
}
function selectedWords() {
  const s = window.getSelection && window.getSelection();
  if (!s || s.isCollapsed || !s.rangeCount || !pager || !pager.D) return null;
  const out = [];
  for (const sp of pager.slots[1].tl.children) if (s.containsNode(sp, true)) out.push(+sp.dataset.w);
  return out.length ? out : null;
}
function textOf(D, words) {
  let t = "";
  for (const p of words) {
    t += (t ? " " : "") + wordText(D, p);
    if (D.ends.has(p)) { const a = ayaOf(D, p); if (!a.basmala) t += " ﴿" + ar(a.aya) + "﴾"; }
  }
  return t;
}
function ayaText(D, a) {
  const ws = [];
  for (let p = a.range[0]; p <= a.range[1]; p++) ws.push(wordText(D, p));
  const name = D.meta.suras[a.sura - 1].name;
  return "﴿" + ws.join(" ") + "﴾ [" + (a.basmala ? "البسملة، سورة الفاتحة" : "سورة " + name + ": " + ar(a.aya)) + "، " + RIW[D.key].long + "]";
}
let toastTimer = 0;
function toast(msg, ms) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms || 1800);
}
function copyText(text) {
  if (!text) return;
  const ok = () => toast("نُسخ النص");
  if (bridge && typeof bridge.copy === "function") { call("copy", text); ok(); return; }
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(ta); ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (_) {}
    ta.remove();
    done ? ok() : toast("تعذّر النسخ؛ حدّد النص بالضغط المطوّل ثم انسخه.", 3000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}
document.addEventListener("copy", e => {
  const D = pager && pager.D, ws = selectedWords();
  if (!D || !ws || !D.words || !e.clipboardData) return;
  e.clipboardData.setData("text/plain", textOf(D, ws));
  e.preventDefault();
});
let selRaf = 0;
document.addEventListener("selectionchange", () => {
  cancelAnimationFrame(selRaf);
  selRaf = requestAnimationFrame(() => {
    const ws = selectedWords();
    if (ws) {
      selWords = ws;
      const D = pager.D;
      selBar.querySelector('[data-act="info"]').hidden = !ws.some(p => D.red.has(p) && D.meta.hafs[p]);
      selBar.hidden = false;
      showSel(ws);
    } else if (!hasSelection()) {
      selBar.hidden = true;
      showSel(null);
    }
  });
});
selBar.addEventListener("pointerdown", e => e.preventDefault());   // keep the selection while tapping
selBar.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"), D = pager && pager.D;
  if (!b || !D || !selWords) return;
  const ws = selWords;
  if (b.dataset.act === "copy") copyText(textOf(D, ws));
  else if (b.dataset.act === "copyAya") copyText(ayaText(D, ayaOf(D, ws[0])));
  else if (b.dataset.act === "info") {
    const p = ws.find(q => D.red.has(q) && D.meta.hafs[q]);
    const a = ayaOf(D, p);
    clearSelection();
    pager.focusAya(a.range);
    openInfo(D, p, a);
    return;
  }
  clearSelection();
});

/* ---------- sheets ---------- */
const indexScrim = document.getElementById("indexScrim"), infoScrim = document.getElementById("infoScrim");
const searchScrim = document.getElementById("searchScrim"), legendScrim = document.getElementById("legendScrim");
const riwScrim = document.getElementById("riwScrim");
const SCRIMS = [indexScrim, infoScrim, searchScrim, legendScrim, riwScrim];
let sheetOpen = false;
const useHistory = !!window.MUSHAF_STANDALONE;   // Android back button closes a sheet
let openedAt = 0;
function openSheet(el) {
  clearSelection();
  SCRIMS.forEach(o => { if (o !== el) o.hidden = true; });
  el.hidden = false;
  openedAt = performance.now();
  if (useHistory && !sheetOpen) { try { history.pushState({sheet: 1}, ""); } catch (_) {} }
  sheetOpen = true;
}
let ignorePop = 0;
function popHistory() { ignorePop++; try { history.back(); } catch (_) { ignorePop--; } }
function closeSheets(fromPop) {
  const was = !infoScrim.hidden;
  SCRIMS.forEach(o => { o.hidden = true; });
  if (useHistory && sheetOpen && !fromPop) { sheetOpen = false; popHistory(); }
  sheetOpen = false;
  const sl = pager && pager.slots[1];
  if (was && sl && sl.hl) { sl.hl = null; pager.render(sl, pager.D, sl.page, "hl"); }
}
window.addEventListener("popstate", () => {
  if (ignorePop) { ignorePop--; return; }          // our own history.back()
  if (sheetOpen) closeSheets(true);
  else if (findPushed) closeFind(true);
});
SCRIMS.forEach(sc => sc.addEventListener("click", e => {
  if (performance.now() - openedAt < 450) return;      // the click that follows the opening tap
  if (e.target === sc || e.target.closest("[data-close]")) closeSheets();
}));

let indexTab = "suras";
function renderIndex() {
  const list = document.getElementById("indexList");
  const D = pager && pager.D;
  if (!D) { list.innerHTML = ""; return; }
  const m = D.meta;
  const curSura = m.pages[state.page - 1].sura, curJuz = m.pages[state.page - 1].juz;
  let html = "";
  if (indexTab === "suras") {
    for (const s of m.suras) {
      html += '<button class="row' + (s.n === curSura ? " cur" : "") + '" data-page="' + s.page + '"><span class="n">' + ar(s.n) +
        '</span><span>سورة ' + s.name + '<span class="meta">' + (s.type === "madani" ? "مدنية" : "مكية") + " · " + ayat(s.ayat) +
        '</span></span><span class="pg">ص ' + ar(s.page) + '</span></button>';
    }
  } else if (indexTab === "juz") {
    for (const j of m.juz) {
      const s = m.suras[m.pages[j.page - 1].sura - 1];
      html += '<button class="row' + (j.n === curJuz ? " cur" : "") + '" data-page="' + j.page + '"><span class="n">' + ar(j.n) +
        '</span><span>الجزء ' + ar(j.n) + '<span class="meta">يبدأ في سورة ' + s.name + ' · الحزبان ' + ar(2 * j.n - 1) + ' و' + ar(2 * j.n) +
        '</span></span><span class="pg">ص ' + ar(j.page) + '</span></button>';
    }
  } else {
    const curHizb = m.pages[state.page - 1].hizb;
    (m.hizb || []).forEach((pg, i) => {
      const s = m.suras[m.pages[pg - 1].sura - 1];
      html += '<button class="row' + (i + 1 === curHizb ? " cur" : "") + '" data-page="' + pg + '"><span class="n">' + ar(i + 1) +
        '</span><span>الحزب ' + ar(i + 1) + '<span class="meta">الجزء ' + ar(Math.ceil((i + 1) / 2)) + ' · سورة ' + s.name +
        '</span></span><span class="pg">ص ' + ar(pg) + '</span></button>';
    });
  }
  list.innerHTML = html;
  const cur = list.querySelector(".cur");
  if (cur) cur.scrollIntoView({block: "center"});
}
function openIndex(focusGoto) {
  renderIndex();
  openSheet(indexScrim);
  document.getElementById("gotoInput").value = "";
  if (focusGoto) setTimeout(() => document.getElementById("gotoInput").focus(), 50);
}
document.getElementById("menuBtn").addEventListener("click", () => openIndex(false));
document.getElementById("indexList").addEventListener("click", e => {

});
function setTab(t) {
  indexTab = t;
  document.getElementById("tabSuras").setAttribute("aria-selected", String(t === "suras"));
  document.getElementById("tabJuz").setAttribute("aria-selected", String(t === "juz"));
  document.getElementById("tabHizb").setAttribute("aria-selected", String(t === "hizb"));

}

let quranFont = null;
function loadQuranFont() {            // the KFGQPC Mashriqi font, for text (search results)
  if (!quranFont) {
    quranFont = getBinary("quran.ttf", "quran.ttf.txt").then(buf => {
      const f = new FontFace("KFGQPC Uthmanic", buf);
      return f.load().then(ff => { document.fonts.add(ff); return true; });
    }).catch(() => false);
  }
  return quranFont;
}

const USUL = new Set(["lam", "badal", "badal_waqf", "badal_aalaan", "badal_khulf", "lin", "lin_sawaat", "tarqiq", "tarqiq_khulf",
  "waqf_taqlil", "waqf_taqlil_khulf", "waqf_imala", "waqf_imala_susi", "idgham_nun", "idgham_nun_khulf", "susi_ibadi", "kabir_suras", "taqlil_basri"]);
const kindOf = (key, code) => { const v = KINDS[code]; return !v ? null : Array.isArray(v) ? v : v[RIW[key] ? RIW[key].reader : "nafi"] || v.nafi; };
const noteCodes = (D, p) => ((D.meta.notes || {})[p] || "").split(",").filter(Boolean);
const SUPERSEDE = {susi_ibadi: ["ya_zaida", "ya_idafa"]};   // a word's own note that says more than the kind
const unsuperseded = (codes, own) => codes.filter(c => !own.some(o => (SUPERSEDE[o] || []).includes(c)));
const esc = t => String(t).replace(/[&<>"]/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[ch]));
const NUM_WORD = ["", "", "قراءتان", "ثلاث قراءات", "أربع قراءات", "خمس قراءات", "ست قراءات", "سبع قراءات"];
function whoOf(K, mask) {          // the riwayat of a reading, named as the Kuwait mushaf names them
  const keys = K.meta.keys.filter((k, i) => mask & (1 << i)), parts = [];
  for (const r of READERS) {
    const ks = r.keys.filter(k => keys.includes(k));
    if (!ks.length) continue;
    if (ks.length === r.keys.length && r.keys.length > 1) parts.push(r.short);
    else for (const k of ks) parts.push(RIW[k].short);
  }
  return parts;
}
function recOf(K, D, p) {          // the readings of the word at position p: [record, of the word before]
  const [a, b] = numOf(D, p);
  for (let n = a; n <= b; n++) { const r = K.meta.rec[n]; if (r) return [r, false]; }
  // a word Hafs reads before it and this riwayah does not (huwa al-ghaniyy): that word's readings
  const back = K.meta.rec[a - 1], bit = 1 << K.meta.keys.indexOf(D.key);
  if (back && back.some(g => g[0] < 0 && (g[1] & bit))) return [back, true];
  return [null, false];
}
function drawRunOn(canvas, S, start, end, adv, upem, red, hpx) {
  // a glyph run (S: path, gl, nostroke, aya) on a canvas sized to it
  const c = col(), dpr = Math.min(3, window.devicePixelRatio || 1);
  hpx = hpx || 56;
  const s = hpx / upem / 1.9, w = Math.max(8, adv * s) + 16;
  canvas.style.width = w + "px"; canvas.style.height = hpx + "px";
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(hpx * dpr);
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const lw = lineW();
  ctx.lineWidth = lw; ctx.lineJoin = "round"; ctx.lineCap = "round";
  const gl = S.gl;
  let fill = null;
  for (let k = start; k < end; k++) {
    const gid = gl[3 * k], path = S.path(gid);
    if (!path) continue;
    const f = red && red.has(k - start) ? c.diff : c.ink;
    if (f !== fill) { ctx.fillStyle = f; ctx.strokeStyle = f; fill = f; }
    ctx.setTransform(dpr * s, 0, 0, -dpr * s, dpr * (8 + gl[3 * k + 1] * s), dpr * (hpx * 0.66 - gl[3 * k + 2] * s));
    ctx.fill(path);
    if (lw > 0 && !S.nostroke.has(gid)) ctx.stroke(path);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function drawWord(canvas, D, p) {
  const tid = D.tokOf[p];
  drawRunOn(canvas, D, D.start[tid], D.start[tid + 1], D.adv[tid], D.meta.upem, D.red.get(p));
}
function drawForm(canvas, K, fi, red, hpx) {
  drawRunOn(canvas, K, K.start[fi], K.start[fi + 1], K.adv[fi], K.meta.upem, red ? new Set(red) : null, hpx);
}
function kindRows(D, codes) {
  return codes.map(c => kindOf(D.key, c)).filter(Boolean)
    .map(([t, d]) => '<div class="kind"><b>' + esc(t) + '</b><span>' + esc(d) + '</span></div>').join("");
}

/* ---------- the dabt legend: every sign with an example from the mushaf ---------- */
const SIGN_ORDER = ["naql", "tashil", "ibdal", "small", "ishmam", "imala", "taqlil", "ikhtilas", "lam", "badal", "lin", "tarqiq"];
function legendCodes(D) {
  if (D.key === "hafs") return ["khilaf"];
  const seen = new Set();
  for (const k in D.meta.notes) for (const c of D.meta.notes[k].split(",")) seen.add(c);
  return ["red", ...(seen.has("whole") ? ["whole"] : []), ...SIGN_ORDER.filter(c => seen.has(c))];
}
function firstWith(D, test) {
  const n = D.meta.notes || {};
  let best = null;
  for (const k of D.red.keys()) if (test(k, (n[k] || "").split(",").filter(Boolean)) && (best === null || k < best)) best = k;
  return best;
}
function pageOf(D, p) {
  if (!D.pageFirst) {
    D.pageFirst = D.meta.pages.map(pg => { const l = pg.lines.find(x => x.t === "w" || x.t === "bw"); return l ? l.a : 0; });
  }
  const f = D.pageFirst;
  let lo = 0, hi = f.length - 1, k = 0;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (f[mid] <= p) { k = mid; lo = mid + 1; } else hi = mid - 1; }
  return k + 1;
}
function refOf(D, p) {
  const a = ayaOf(D, p);
  return a.basmala ? "البسملة" : "سورة " + D.meta.suras[a.sura - 1].name + " · " + ar(a.aya);
}

      : code === "khilaf" ? firstWith(D, () => true)
      : code === "whole" ? firstWith(D, (k, c) => c.includes("whole"))

/* ---------- search: part of a word, a whole word, or an aya / a phrase ----------
   Each word is matched in two spellings: the ordinary (imla'i) spelling of the
   KFGQPC text (data/<key>.search.txt) and the Uthmani spelling of the mushaf; both
   and the query are folded (no vowels or signs; hamza seats, alif forms, ta marbuta
   and alif maqsura unified), so «الصلاة» and «الصلوة», «يسألون» and «يسالون», «السماوات»
   and «السموات» find the same words.  With no result, alifs are ignored too. */
const SIGNS_RX = /[ؐ-ًؚ-ٰٟۖ-ۭࢃ-࢏࣓-ࣿـ​-‏ ]/g;
function fold(t, uthmani) {
  if (uthmani) {
    t = t.replace(/ـۧ/g, "ي")                                  // al-nabiyyin
      .replace(/[وى]ٰ(?=[ء-ي])/g, "ا")            // salah, tawrah
      .replace(/ٰ/g, "ا")                                             // the dagger alif
      .replace(/[ࡰ-ࢂ]/g, "ا")                                    // the alifs of Warsh's naql and tas-hil
      .replace(/ۦ(?=[ء-ي])/g, "ي");                         // li-ilafi
  }
  return t.replace(SIGNS_RX, "")
    .replace(/[أإآٱ]/g, "ا").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/ء/g, "")
    .replace(/[ىےۑی]/g, "ي").replace(/ة/g, "ه").replace(/ک/g, "ك")
    .replace(/ا{2,}/g, "ا").replace(/وا(?=\s|$)/g, "و");
}
const noAlif = t => t.replace(/ا/g, "");
function loadSearch(D) {
  if (!D.searchP) {
    D.searchP = Promise.all([
      D.pack && typeof D.pack.search === "string" ? Promise.resolve(D.pack.search) : getText(D.key + ".search.txt"),
      loadWords(D)
    ]).then(([t]) => {
      const imlai = t.split("\n");
      const N = D.tokOf.length;
      if (imlai.length !== N) throw new Error("search text");
      const tokFold = D.words.map(w => fold(w, true));
      const build = get => {
        const off = new Int32Array(N + 1), parts = [];
        let len = 0;
        for (let p = 0; p < N; p++) {
          off[p] = len;
          const w = get(p);
          parts.push(w, D.ends.has(p) ? "\n" : " ");
          len += w.length + 1;
        }

      };

function wordAt(off, c) {

  while (lo <= hi) { const mid = (lo + hi) >> 1; if (off[mid] <= c) { k = mid; lo = mid + 1; } else hi = mid - 1; }
  return k;
}
function searchRx(q, mode, loose) {
  let words = fold(q, true).split(/\s+/).filter(Boolean);
  if (loose) words = words.map(noAlif).filter(Boolean);

  const body = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join(" ");
  return mode === "word" ? new RegExp("(^|[ \\n])(" + body + ")(?=[ \\n]|$)", "g") : new RegExp("()(" + body + ")", "g");
}
function runSearch(D, q, mode) {

    rx.lastIndex = 0;

      if (m[2].length === 0) { rx.lastIndex++; continue; }

    }

  }
  // group by aya, in the order of the mushaf
  const byAya = new Map();
  for (const p0 of [...hits.keys()].sort((x, y) => x - y)) {
    const a = ayaOf(D, p0), key = a.range[0];
    let r = byAya.get(key);
    if (!r) { r = {aya: a, words: new Set(), first: p0, n: 0}; byAya.set(key, r); }
    hits.get(p0).forEach(p => r.words.add(p));

const searchInput = document.getElementById("searchInput"), searchStat = document.getElementById("searchStat");

function refSearch(D, q) {
  // a sura and an aya number: «البقرة ٢٥٥»، «سورة الكهف ١٠»، «2:255»
  const t = q.replace(/[٠-٩]/g, d => DIG.indexOf(d)).replace(/[:：،,.\-]/g, " ").replace(/\s+/g, " ").trim();
  let m = t.match(/^(\d{1,3}) (\d{1,3})$/), sura = 0, aya = 0;

    const want = fold(m[1], true).replace(/^ال/, "").replace(/\s/g, "");

  if (!sura || sura > D.meta.suras.length || aya < 1 || aya > D.meta.suras[sura - 1].ayat) return null;

}
